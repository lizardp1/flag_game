[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flag-game"
version = "0.1.0"
description = "Flag Game experiment and final-paper reproduction bundle."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.49",
  "httpx>=0.27",
  "matplotlib>=3.8",
  "numpy>=1.24",
  "openai>=1.55",
  "pandas>=2.0",
  "pillow>=10.0",
  "pydantic>=2.0,<3",
  "PyYAML>=6.0",
  "rich>=13.0",
  "typer>=0.12",
]

[project.optional-dependencies]
paper = []
dev = [
  "pytest>=8.0",
]

[project.scripts]
nnd = "nnd.cli:app"
nnd-flag-game = "nnd.flag_game.cli:app"
nnd-flag-game-broadcast = "nnd.flag_game_broadcast.cli:app"
nnd-flag-game-org = "nnd.flag_game_org.cli:app"
flag-game = "nnd.flag_game.cli:app"
flag-game-broadcast = "nnd.flag_game_broadcast.cli:app"
flag-game-org = "nnd.flag_game_org.cli:app"

[tool.setuptools.packages.find]
include = ["nnd*"]
