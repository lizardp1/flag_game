name: Research checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/render_prompt_reference.py
      - run: git diff --exit-code -- prompts/
      - run: bash paper/figures/build.sh
      - run: python theory/validate.py
