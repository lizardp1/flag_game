backend: openai_compatible
model: moonshotai/Kimi-K2-Instruct-0905
protocol: pairwise
N: 8
T: 160
rounds: 10
H: 8
interaction_m: 1
probe_every: 8
min_number: 1
max_number: 100
prompt_number_range: true
fixed_truth_number: null
social_susceptibility: 0.5
prompt_social_susceptibility: false
max_influential_agents: 3
aggregator_agent_id: 0
temperature: 0.2
top_p: 1.0
max_tokens: 128
consensus_threshold: 0.9
early_stop_window: 5
agent_workers: 4
seed_workers: 1
condition_workers: 1
capture_hidden_states: false
hidden_state_layers: [-1]
use_response_format: true
api_base_url: http://localhost:8000/v1
api_key: local
trust_remote_code: true
torch_dtype: auto
device_map: auto
enable_thinking: false
